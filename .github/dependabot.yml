version: 2
updates:
  # Rust crates for the relay (root Cargo.toml).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by the APK workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Gradle dependencies for the Android HCE client.
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
