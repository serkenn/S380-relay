name: Android APK

on:
  push:
    tags: ["v*"]                       # tag push -> build + attach to a Release
    branches: [main]                   # main push -> build + upload as artifact
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:                    # manual run from the Actions tab

permissions:
  contents: write                       # needed to create the Release / upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted ubuntu runners ship the Android SDK (ANDROID_HOME) with
      # platforms/build-tools and pre-accepted licenses, so we use that instead
      # of a setup action. Re-accepting licenses is best-effort and must not
      # fail the job; AGP auto-provisions anything still missing.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"         # no wrapper committed; provision Gradle

      # Each runner generates a fresh debug keystore, so every build was signed
      # with a different key and could not be installed over the previous one.
      # Restore a fixed debug keystore from the DEBUG_KEYSTORE_B64 secret
      # (base64 of a keystore with the standard debug credentials: alias
      # androiddebugkey, passwords "android") and point Gradle at it.
      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "${DEBUG_KEYSTORE_B64}" ]; then
            echo "::warning::DEBUG_KEYSTORE_B64 is not set; the APK is signed with a throwaway key and will not install over an earlier build"
            exit 0
          fi
          echo "${DEBUG_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/debug.keystore"
          # Read by android/app/build.gradle.kts (signingConfigs.debug).
          echo "DEBUG_KEYSTORE=${RUNNER_TEMP}/debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          mkdir -p dist
          NAME="s380-relay-hce-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Show signing certificate
        run: keytool -printcert -jarfile "dist/${{ steps.apk.outputs.name }}" | grep -E "Owner|SHA256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
