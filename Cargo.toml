[package]
name = "s380-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Relay FeliCa/NFC-F traffic between two Sony RC-S380 (Port-100) readers over the network"
license = "Apache-2.0"

[dependencies]
felica = "1.0"
rusb = "0.9"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.5"

[[bin]]
name = "s380-relay"
path = "src/main.rs"

# Patched felica with the RC-S300 (Port-400) ISO 14443-4 Type B fix
# (SwitchProtocol ATR detection + best-effort S(IFS)). Fork of
# https://github.com/soltia48/felica-rs; drop this once it lands upstream.
[patch.crates-io]
felica = { git = "https://github.com/serkenn/felica-rs", branch = "fix-rcs300-typeb" }
